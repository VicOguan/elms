<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELMS | Login</title>

    <link rel="stylesheet" href="elms-frontend/css/login.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <a href="index.html" class="logo">
        ELMS
    </a>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html" class="active">Login</a>
    </div>
</nav>

<!-- Login Section -->
<section class="login-container">

    <div class="login-left">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p>Sign in to Employee Leave Management System</p>

            <input
                    id="username"
                    type="text"
                    placeholder="Username">

            <input
                    id="password"
                    type="password"
                    placeholder="Password">

            <button type="button" onclick="login()">
                Login
            </button>

            <p id="message"></p>

        </div>

    </div>

    <div class="login-right">

        <AsyncImage query="employee leave management system illustration blue office workers" aspectRatio="1:1" maxWidth=420/>

            <h2>Manage Employee Leaves Efficiently</h2>

            <p>
                Secure authentication, leave tracking, approvals,
                and role-based access—all in one system.
            </p>

    </div>

</section>

<script src="elms-frontend/js/auth.js"></script>

</body>
</html>
