<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELMS Dashboard</title>

    <link rel="stylesheet" href="elms-frontend/css/dashboard.css">
</head>

<body>

<div class="sidebar">

    <div class="logo" onclick="goHome()">ELMS</div>

    <!-- Employee -->
    <button id="myLeavesBtn" onclick="showMyLeaves()">My Leaves</button>
    <button id="submitLeaveBtn" onclick="showLeaveForm()">Submit Leave</button>

    <!-- Manager/Admin -->
    <button id="dashboardBtn" onclick="showDashboard()" style="display:none;">Dashboard</button>
    <button id="employeeBtn" onclick="loadEmployees()" style="display:none;">Employees</button>
    <button id="leaveRequestBtn" onclick="loadLeaves()" style="display:none;">Leave Requests</button>

    <!-- Admin only -->
    <button id="addEmployeeBtn" onclick="showEmployeeForm()" style="display:none;">
        Add Employee
    </button>

    <button onclick="logout()">Logout</button>

</div>

<div class="main">

    <header class="top-bar">
        <div>
            <h1 id="welcomeText">Welcome</h1>
        </div>
        <div class="user-profile-badge">
            <div class="person-icon-wrapper small">
                <svg class="person-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <span id="userRoleBadge" class="user-role-badge">USER</span>
        </div>
    </header>

    <div id="contentArea"></div>

</div>

<script src="elms-frontend/js/dashboard.js"></script>
<script src="elms-frontend/js/leave.js"></script>

</body>
</html>
